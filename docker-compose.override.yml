# Development override for docker-compose.yml
#
# Activates hot-reload via mounted source directories, enables debug logging,
# exposes additional development ports, and disables rate limiting.
#
# Usage:
#   docker compose up -d          # uses this override automatically
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
#   docker compose up -d --no-ansi  # skip override

services:
  # --------------------------------------------------------------------------
  # Backend — hot reload with tsx watch, debug logging, extra ports
  # --------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    command: ["npx", "tsx", "watch", "src/server.ts"]
    volumes:
      - ./backend/src:/app/src:ro
      - ./backend/package.json:/app/package.json:ro
      - ./shared:/shared:ro
      - ./certs:/app/certs:ro
      # Inline scan endpoint imports the @appsec/scanners engine directly.
      # Mount the package into node_modules so the bare specifier resolves in
      # this container (pino etc. resolve upward from the backend's own deps).
      - ./scanners:/app/node_modules/@appsec/scanners:ro
    ports:
      # Debugger (Node.js inspect)
      - "${DEBUG_PORT:-9229}:9229"
      # Optional HTTP fallback
      - "${BACKEND_HTTP_PORT:-3002}:3002"
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DEBUG: "bullmq:*,-bullmq:job"
    # Disable rate limiting in dev
    # (override via env var — the backend checks for this)
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 50000

  # backend-worker removed — see note in docker-compose.yml (it ran stub scan
  # processors that raced and corrupted real scanner results).

  # --------------------------------------------------------------------------
  # SAST Worker — hot reload
  # --------------------------------------------------------------------------
  sast-worker:
    command: ["npx", "tsx", "watch", "src/sast-worker.ts"]
    volumes:
      - ./scanners/src:/app/src:ro
      - ./scanners/package.json:/app/package.json:ro
      - ./scanners/tsconfig.json:/app/tsconfig.json:ro
      - ./shared:/shared:ro
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug

  # --------------------------------------------------------------------------
  # DAST Worker — hot reload
  # --------------------------------------------------------------------------
  dast-worker:
    command: ["npx", "tsx", "watch", "src/dast-worker.ts"]
    volumes:
      - ./scanners/src:/app/src:ro
      - ./scanners/package.json:/app/package.json:ro
      - ./scanners/tsconfig.json:/app/tsconfig.json:ro
      - ./shared:/shared:ro
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug

  # --------------------------------------------------------------------------
  # API Scanner Worker — hot reload
  # --------------------------------------------------------------------------
  api-scanner-worker:
    command: ["npx", "tsx", "watch", "src/api-scanner-worker.ts"]
    volumes:
      - ./scanners/src:/app/src:ro
      - ./scanners/package.json:/app/package.json:ro
      - ./scanners/tsconfig.json:/app/tsconfig.json:ro
      - ./shared:/shared:ro
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug

  # --------------------------------------------------------------------------
  # Enterprise Worker — hot reload, runs all 5 enterprise scanners
  # --------------------------------------------------------------------------
  enterprise-worker:
    command: ["npx", "tsx", "watch", "src/enterprise-worker.ts"]
    volumes:
      - ./scanners/src:/app/src:ro
      - ./scanners/package.json:/app/package.json:ro
      - ./scanners/tsconfig.json:/app/tsconfig.json:ro
      - ./shared:/shared:ro
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      # Expose additional ports for worker-specific health/debug endpoints
    ports:
      - "${WORKER_DEBUG_PORT:-9300}:9300"

  # --------------------------------------------------------------------------
  # SCA Worker — hot reload
  # --------------------------------------------------------------------------
  sca-worker:
    command: ["npx", "tsx", "watch", "src/sca-worker.ts"]
    volumes:
      - ./scanners/src:/app/src:ro
      - ./scanners/package.json:/app/package.json:ro
      - ./scanners/tsconfig.json:/app/tsconfig.json:ro
      - ./shared:/shared:ro
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug

  # --------------------------------------------------------------------------
  # Secret Worker — hot reload (secrets exposure hunter)
  # --------------------------------------------------------------------------
  secret-worker:
    command: ["npx", "tsx", "src/secret-worker.ts"]
    volumes:
      - ./scanners/src:/app/src:ro
      - ./scanners/package.json:/app/package.json:ro
      - ./scanners/tsconfig.json:/app/tsconfig.json:ro
      - ./shared:/shared:ro
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug

  # --------------------------------------------------------------------------
  # Report Worker — hot reload
  # --------------------------------------------------------------------------
  report-worker:
    command: ["node", "dist/report-worker.js"]
    volumes:
      - ./workers/dist:/app/dist:ro
      - ./workers/node_modules:/app/node_modules
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug

  # --------------------------------------------------------------------------
  # Frontend — production build served by nginx (no dev server)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        CONFIGURATION: production

  # --------------------------------------------------------------------------
  # PostgreSQL — expose port for local tooling
  # --------------------------------------------------------------------------
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-appsec_secure_password_2024}

  # --------------------------------------------------------------------------
  # Redis — expose port for local tooling, less strict memory limit in dev
  # --------------------------------------------------------------------------
  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secure_password_2024}
      --appendonly yes
      --maxmemory 1gb
      --maxmemory-policy noeviction

  # --------------------------------------------------------------------------
  # Nginx — additional dev ports
  # --------------------------------------------------------------------------
  nginx:
    ports:
      # HTTP-only endpoint (useful when certificates aren't set up)
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/dev-cache:/var/cache/nginx
    environment:
      NGINX_DEV: "true"

  # --------------------------------------------------------------------------
  # MailHog — SMTP catcher for dev (ports not working — Docker proxy issue,
  # revisit when email notifications are needed)
  # --------------------------------------------------------------------------
  # mailhog:
  #   ports:
  #     - "21025:1025"
  #     - "21026:8025"

  # --------------------------------------------------------------------------
  # Chromium / Browserless — dev port for debugging
  # --------------------------------------------------------------------------
  chromium:
    ports:
      - "${CHROMIUM_PORT:-3000}:3000"
    environment:
      CONNECTION_TIMEOUT: 600000
      MAX_CONCURRENT_SESSIONS: 10
      # Keep in sync with docker-compose.yml: no idle preboot pool; Chrome is
      # launched per-session and reaped on close.
      PREBOOT_CHROME: "false"
      KEEP_ALIVE: "false"
      TOKEN: ${CHROMIUM_TOKEN:-chrome_internal_token}
