<!DOCTYPE html>
<html lang="en" class="dark-theme">
<head>
  <meta charset="utf-8">
  <title>DeepVigilance — From code to container</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="DeepVigilance — unified application security platform: SAST, DAST, SCA/SBOM, container & binary scanning, API security, and vulnerability management. From code to container.">
  <meta name="theme-color" content="#0a1018">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet">
  <style>
    body { margin: 0; font-family: 'Inter', sans-serif; background: #0a1018; color: #e2e8f0; }
    .app-loading { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }
    .app-loading .spinner { width: 48px; height: 48px; border: 3px solid #1c2b3d; border-top-color: #22d3ee; border-radius: 50%; animation: spin 0.8s linear infinite; }
    .app-loading .title { margin-top: 20px; font-size: 20px; font-weight: 600; background: linear-gradient(135deg, #14b8a6 0%, #22d3ee 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <app-root>
    <div class="app-loading">
      <div class="spinner"></div>
      <div class="title">Loading DeepVigilance…</div>
    </div>
  </app-root>
</body>
</html>
