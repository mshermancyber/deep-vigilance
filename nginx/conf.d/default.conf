# Rewrite the HTTP host:port to the matching HTTPS host:port for the 80->443
# redirect. nginx inside the container only sees its internal port (80), not the
# published host port, so we key off the client's Host header ($http_host) which
# carries the external port. Without this the redirect drops the custom port and
# lands on whatever else owns :443 on the host (e.g. another local app).
# If you publish the edge on non-default host ports (HTTP_PORT / HTTPS_PORT in
# .env), add the matching pair here so the redirect keeps your port:
#   dev/base:  localhost:8080 -> localhost:8443
#   prod:      example.com    -> example.com (default, :443)
map $http_host $https_redirect_host {
    default          $http_host;
    "localhost:8080" "localhost:8443";
    "127.0.0.1:8080" "127.0.0.1:8443";
    "[::1]:8080"     "[::1]:8443";
}

# HSTS is keyed to the hostname, NOT the port — sending it for `localhost` would
# force-upgrade every other http://localhost:<port> app on this machine to HTTPS
# for the max-age window. Only emit it for real domains; suppress for localhost/IPs.
map $host $hsts_header {
    default      "max-age=63072000; includeSubDomains; preload";
    "~^localhost" "";
    "~^127\."     "";
    "~^\[?::1\]?" "";
}

upstream backend_api {
    server backend:3000;
    keepalive 32;
}

upstream backend_ws {
    server backend:3001;
    keepalive 32;
}

upstream frontend_app {
    server frontend:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    location / {
        return 301 https://$https_redirect_host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Empty value → nginx omits the header (so no HSTS poisoning on localhost).
    add_header Strict-Transport-Security $hsts_header always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Frame-Options "DENY";

    # Auth responses set 3 JWT cookies (access/refresh/csrf); the default 4k/8k
    # header buffer overflows them → "upstream sent too big header" (502).
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    location /api/ws {
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_cache off;

        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 24k;
    }

    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_cache off;
    }

    location /health {
        proxy_pass http://backend_api/api/health;
        proxy_http_version 1.1;
        proxy_cache off;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;

        # A nested location does NOT inherit the parent's proxy_pass; without its
        # own, nginx falls back to serving from disk (404 for all bundle assets,
        # leaving the SPA stuck on a spinner). Re-declare the proxy here.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }

    location = /favicon.ico {
        proxy_pass http://frontend_app;
        expires 7d;
    }
}
